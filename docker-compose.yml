services:
  tessh-server:
    image: ghcr.io/bobzth/tessh-server:latest
    build: .
    container_name: tessh-server
    restart: unless-stopped
    environment:
      # Required: the address people and apps use to reach this server (your reverse proxy's HTTPS URL).
      PUBLIC_URL: https://sync.example.com
      # open | invite | closed. With invite, make invites under Invites in the panel (/admin).
      SIGNUPS: invite
      SERVER_NAME: Tessh
    ports:
      # Setup, the panel, the API and key pages. Put a reverse proxy with HTTPS in front of this.
      - "127.0.0.1:8080:8080"
    volumes:
      - tessh-data:/data

volumes:
  tessh-data:
